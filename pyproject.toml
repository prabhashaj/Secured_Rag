[project]
name = "legal-rag"
version = "0.1.0"
description = "Secure multi-agent RAG for legal document analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "mistralai>=1.0.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = [
    "schemas*",
    "orchestrator*",
    "agents*",
    "vectorstore*",
    "tools*",
    "approval*",
    "audit*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
